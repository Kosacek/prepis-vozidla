<style>
  .dz1370-demo {
    box-sizing: border-box; height: 140px; padding: 14px; margin-bottom: 16px;
    border-radius: 12px; background: var(--wn-bg); display: flex; align-items: center;
    justify-content: center; gap: 14px; overflow: hidden; font-size: 11px; line-height: 1.2;
    color: var(--wn-ink);
  }
  .dz1370-kamera {
    position: relative; flex: none; width: 128px; height: 92px; border-radius: 9px; overflow: hidden;
    background: repeating-linear-gradient(0deg, #7a5c3e 0 3px, #866648 3px 6px);
  }
  /* Karta i obrys sdílí stejnou polohu a natočení: obrys sedí na rozích. */
  .dz1370-karta, .dz1370-obrys {
    position: absolute; left: 24px; top: 21px; width: 80px; height: 50px; border-radius: 3px;
    transform: rotate(-9deg); animation: dz1370-karta 4s var(--nv-ease) infinite;
  }
  .dz1370-karta { background: #f1ece6; box-shadow: 0 2px 5px rgba(0,0,0,.35); }
  .dz1370-karta i { position: absolute; left: 22px; height: 3px; border-radius: 2px; background: #64748b; }
  .dz1370-karta i:nth-child(1) { top: 9px; width: 34px; }
  .dz1370-karta i:nth-child(2) { top: 17px; width: 44px; }
  .dz1370-karta i:nth-child(3) { top: 25px; width: 28px; }
  .dz1370-karta i:nth-child(4) { top: 37px; left: 7px; width: 30px; background: #111; }
  .dz1370-karta b { position: absolute; top: 7px; left: 6px; width: 11px; height: 8px; border-radius: 1px; background: #1e3a8a; }
  .dz1370-obrys {
    box-sizing: border-box; border: 1.5px solid #fff; background: rgba(255,255,255,0);
    filter: drop-shadow(0 0 1px rgba(0,0,0,.6)); opacity: 0;
    animation: dz1370-karta 4s var(--nv-ease) infinite, dz1370-obrys 4s var(--nv-ease) infinite;
  }
  .dz1370-blesk { position: absolute; inset: 0; background: #fff; opacity: 0; animation: dz1370-blesk 4s linear infinite; }
  .dz1370-bar {
    position: absolute; left: 7px; right: 7px; bottom: 6px; height: 2px; border-radius: 1px;
    background: rgba(255,255,255,.3); overflow: hidden;
  }
  .dz1370-bar::after {
    content: ""; position: absolute; inset: 0; background: #fff; transform-origin: left; transform: scaleX(0);
    animation: dz1370-bar 4s linear infinite;
  }
  .dz1370-form { display: grid; gap: 7px; width: 112px; }
  .dz1370-pole {
    position: relative; height: 26px; padding: 0 7px; display: flex; align-items: center;
    border: 1px solid var(--wn-line); border-radius: 6px; background: var(--wn-card);
    font-weight: 700; letter-spacing: .02em;
  }
  .dz1370-pole small { position: absolute; top: -6px; left: 6px; padding: 0 3px; background: var(--wn-bg); color: var(--wn-muted); font-size: 8px; font-weight: 600; letter-spacing: 0; }
  .dz1370-pole span { opacity: 0; animation: dz1370-pole 4s var(--nv-ease) infinite; }
  .dz1370-pole:nth-child(2) span { animation-delay: .1s; }
  @keyframes dz1370-karta {
    0%, 8% { transform: translate(110%, 30%) rotate(-20deg); }
    24%, 88% { transform: rotate(-9deg); }
    100% { transform: translate(110%, 30%) rotate(-20deg); }
  }
  /* Obrys karty sleduje, pak se zpevní, při fotce sevře. */
  @keyframes dz1370-obrys {
    0%, 10% { opacity: 0; border-width: 1px; background: rgba(255,255,255,0); }
    16% { opacity: .75; border-width: 1px; }
    30% { opacity: 1; border-width: 1.5px; background: rgba(255,255,255,.06); }
    36% { border-width: 2.5px; background: rgba(255,255,255,.22); }
    84% { opacity: 1; border-width: 2.5px; background: rgba(255,255,255,.18); }
    92%, 100% { opacity: 0; }
  }
  @keyframes dz1370-blesk { 0%, 33% { opacity: 0; } 35% { opacity: .5; } 42%, 100% { opacity: 0; } }
  /* Proužek: rychle na začátku, zpomalí při čtení, 100 % až s vyplněnými poli. */
  @keyframes dz1370-bar {
    0%, 35% { transform: scaleX(0); opacity: 1; }
    40% { transform: scaleX(.28); }
    55% { transform: scaleX(.62); }
    66% { transform: scaleX(.74); }
    72% { transform: scaleX(1); }
    84% { transform: scaleX(1); opacity: 1; }
    90%, 100% { transform: scaleX(1); opacity: 0; }
  }
  @keyframes dz1370-pole {
    0%, 70% { opacity: 0; transform: translateY(3px); }
    76%, 88% { opacity: 1; transform: none; }
    96%, 100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dz1370-karta, .dz1370-obrys, .dz1370-pole span, .dz1370-bar::after { animation: none; }
    .dz1370-karta, .dz1370-obrys { transform: rotate(-9deg); }
    .dz1370-obrys { opacity: 1; border-width: 2.5px; }
    .dz1370-pole span { opacity: 1; }
    .dz1370-bar::after { transform: scaleX(1); }
    .dz1370-blesk { animation: none; }
  }
</style>
<div class="dz1370-demo" aria-hidden="true">
  <div class="dz1370-kamera">
    <div class="dz1370-karta"><b></b><i></i><i></i><i></i><i></i></div>
    <div class="dz1370-obrys"></div>
    <div class="dz1370-blesk"></div>
    <div class="dz1370-bar"></div>
  </div>
  <div class="dz1370-form">
    <div class="dz1370-pole"><small>RZ</small><span>3BR 9309</span></div>
    <div class="dz1370-pole"><small>ORV</small><span>UBZ 482615</span></div>
  </div>
</div>

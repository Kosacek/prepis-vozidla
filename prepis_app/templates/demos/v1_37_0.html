<style>
  .dz1370-demo {
    box-sizing: border-box; height: 140px; padding: 14px; margin-bottom: 16px;
    border-radius: 12px; background: var(--wn-bg); display: flex; align-items: center;
    justify-content: center; gap: 14px; overflow: hidden; font-size: 11px; line-height: 1.2;
    color: var(--wn-ink);
  }
  .dz1370-kamera {
    position: relative; flex: none; width: 128px; height: 92px; border-radius: 9px;
    background: #1f2937; overflow: hidden;
  }
  .dz1370-karta {
    position: absolute; left: 22px; top: 18px; width: 84px; height: 56px; border-radius: 5px;
    background: #e8f3ec; box-shadow: 0 2px 6px rgba(0,0,0,.35);
    animation: dz1370-karta 4s var(--nv-ease) infinite;
  }
  .dz1370-karta i { position: absolute; left: 7px; height: 4px; border-radius: 2px; background: #94a3b8; }
  .dz1370-karta i:nth-child(1) { top: 8px; width: 40px; }
  .dz1370-karta i:nth-child(2) { top: 17px; width: 52px; }
  .dz1370-karta i:nth-child(3) { top: 26px; width: 30px; }
  .dz1370-karta i:nth-child(4) { top: 40px; width: 46px; background: #dc2626; }
  .dz1370-karta b {
    position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 2px;
    background: repeating-linear-gradient(90deg, #111 0 3px, #e8f3ec 3px 5px),
                repeating-linear-gradient(0deg, #111 0 3px, #e8f3ec 3px 5px);
    background-blend-mode: multiply;
  }
  .dz1370-rohy { position: absolute; inset: 9px 14px; animation: dz1370-rohy 4s var(--nv-ease) infinite; }
  .dz1370-rohy i { position: absolute; width: 12px; height: 12px; border: 0 solid #fff; }
  .dz1370-rohy i:nth-child(1) { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 5px; }
  .dz1370-rohy i:nth-child(2) { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 5px; }
  .dz1370-rohy i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 5px; }
  .dz1370-rohy i:nth-child(4) { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 5px; }
  .dz1370-blesk { position: absolute; inset: 0; background: #fff; opacity: 0; animation: dz1370-blesk 4s linear infinite; }
  .dz1370-form { display: grid; gap: 7px; width: 112px; }
  .dz1370-pole {
    position: relative; height: 26px; padding: 0 7px; display: flex; align-items: center;
    border: 1px solid var(--wn-line); border-radius: 6px; background: var(--wn-card);
    font-weight: 700; letter-spacing: .02em;
  }
  .dz1370-pole small { position: absolute; top: -6px; left: 6px; padding: 0 3px; background: var(--wn-bg); color: var(--wn-muted); font-size: 8px; font-weight: 600; letter-spacing: 0; }
  .dz1370-pole span { opacity: 0; animation: dz1370-pole 4s var(--nv-ease) infinite; }
  .dz1370-pole:nth-child(2) span { animation-delay: .12s; }
  @keyframes dz1370-karta {
    0%, 10% { transform: translateY(120%); }
    28%, 86% { transform: none; }
    100% { transform: translateY(120%); }
  }
  @keyframes dz1370-rohy {
    0%, 32% { opacity: 0; transform: scale(1.12); }
    46%, 82% { opacity: 1; transform: none; }
    90%, 100% { opacity: 0; transform: none; }
  }
  @keyframes dz1370-blesk {
    0%, 49% { opacity: 0; }
    51% { opacity: .85; }
    60%, 100% { opacity: 0; }
  }
  @keyframes dz1370-pole {
    0%, 56% { opacity: 0; transform: translateY(3px); }
    64%, 88% { opacity: 1; transform: none; }
    96%, 100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dz1370-karta, .dz1370-rohy, .dz1370-pole span { animation: none; opacity: 1; transform: none; }
    .dz1370-blesk { animation: none; }
  }
</style>
<div class="dz1370-demo" aria-hidden="true">
  <div class="dz1370-kamera">
    <div class="dz1370-karta"><i></i><i></i><i></i><i></i><b></b></div>
    <div class="dz1370-rohy"><i></i><i></i><i></i><i></i></div>
    <div class="dz1370-blesk"></div>
  </div>
  <div class="dz1370-form">
    <div class="dz1370-pole"><small>RZ</small><span>3BR 9309</span></div>
    <div class="dz1370-pole"><small>ORV</small><span>UBZ 482615</span></div>
  </div>
</div>

{# Demo for release 1.10.0 (Náhled dokladu a víc vozidel): in the receipt preview,
   "Vozidlo" is tapped, a new SPZ row types itself and joins the preview.
   CSS-only, 6s loop; app tokens only. Included by _whats_new.html. #}
<style>
  .dz1100-demo {
    box-sizing: border-box; height: 134px; padding: 12px; margin-bottom: 16px;
    border-radius: 12px; background: var(--wn-bg); overflow: hidden;
    display: grid; align-content: center; gap: 5px;
    font-size: 11px; line-height: 1.2; color: var(--wn-ink);
  }
  .dz1100-head { display: flex; align-items: center; justify-content: space-between; height: 22px; }
  .dz1100-sum { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--wn-muted); }
  .dz1100-add {
    display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; box-sizing: border-box;
    border: 1px solid var(--wn-line); border-radius: 8px; background: var(--wn-card);
    font-size: 10.5px; font-weight: 700; color: var(--wn-ink);
    animation: dz1100-add 6s cubic-bezier(.2, .7, .3, 1) infinite;
  }
  .dz1100-prev {
    display: grid; gap: 4px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--wn-line); background: var(--wn-card); font-size: 11px;
  }
  .dz1100-k { font-weight: 700; color: var(--wn-muted); margin-right: 3px; }
  .dz1100-num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .dz1100-sp2 { display: inline-block; padding: 0 3px 0 0; border-radius: 3px; opacity: 0; animation: dz1100-sp2 6s cubic-bezier(.2, .7, .3, 1) infinite; }
  .dz1100-extra {
    display: flex; align-items: center; gap: 6px; height: 22px;
    opacity: 0; animation: dz1100-extra 6s cubic-bezier(.2, .7, .3, 1) infinite;
  }
  .dz1100-input {
    box-sizing: border-box; flex: 1; min-width: 0; height: 22px; padding: 0 8px; display: flex; align-items: center;
    border: 1.5px solid var(--wn-line); border-radius: 6px; background: var(--wn-card);
    font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; overflow: hidden;
    animation: dz1100-input 6s cubic-bezier(.2, .7, .3, 1) infinite;
  }
  .dz1100-typed { white-space: nowrap; clip-path: inset(0 100% 0 0); animation: dz1100-type 6s infinite; }
  .dz1100-trash { flex: none; color: var(--wn-muted); }

  @keyframes dz1100-add {
    0%, 12%  { transform: scale(1); background: var(--wn-card); border-color: var(--wn-line); color: var(--wn-ink); }
    16%      { transform: scale(.94); background: var(--wn-soft); border-color: var(--wn-accent); color: var(--wn-accent); }
    24%, 92% { transform: scale(1); background: var(--wn-card); border-color: var(--wn-line); color: var(--wn-ink); }
    100%     { transform: scale(1); background: var(--wn-card); border-color: var(--wn-line); color: var(--wn-ink); }
  }
  @keyframes dz1100-extra {
    0%, 16%  { opacity: 0; transform: translateY(-5px); }
    26%, 92% { opacity: 1; transform: none; }
    100%     { opacity: 0; transform: translateY(-5px); }
  }
  @keyframes dz1100-input {
    0%, 26%  { border-color: var(--wn-accent); }
    46%, 92% { border-color: var(--wn-line); }
    100%     { border-color: var(--wn-accent); }
  }
  @keyframes dz1100-type {
    0%, 28%  { clip-path: inset(0 100% 0 0); animation-timing-function: steps(8, end); }
    42%, 92% { clip-path: inset(0 0 0 0); }
    100%     { clip-path: inset(0 100% 0 0); }
  }
  @keyframes dz1100-sp2 {
    0%, 44%  { opacity: 0; background: transparent; }
    50%      { opacity: 1; background: var(--wn-soft); }
    70%, 92% { opacity: 1; background: transparent; }
    100%     { opacity: 0; background: transparent; }
  }

  @media (prefers-reduced-motion: reduce) {
    /* End state: second vehicle typed and listed on the receipt preview. */
    .dz1100-add, .dz1100-sp2, .dz1100-extra, .dz1100-input, .dz1100-typed { animation: none; }
    .dz1100-sp2, .dz1100-extra { opacity: 1; transform: none; }
    .dz1100-typed { clip-path: none; }
  }
</style>
<div class="dz1100-demo" aria-hidden="true">
  <div class="dz1100-head">
    <span class="dz1100-sum">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3h12v18l-3-2-3 2-3-2z"/><path d="M9.5 8h5M9.5 12h5"/></svg>
      Náhled dokladu
    </span>
    <span class="dz1100-add">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Přidat vozidlo
    </span>
  </div>
  <div class="dz1100-prev">
    <div><span class="dz1100-k">SPZ:</span><span class="dz1100-num">2AB 1234</span><span class="dz1100-sp2 dz1100-num">, 2CD 6789</span></div>
    <div><span class="dz1100-k">Částka:</span><span class="dz1100-num">500 Kč</span></div>
  </div>
  <div class="dz1100-extra">
    <span class="dz1100-input"><span class="dz1100-typed">2CD 6789</span></span>
    <svg class="dz1100-trash" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
  </div>
</div>

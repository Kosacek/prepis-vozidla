{# Demo for release 1.35.0 (Jeden kód na všechno): a "/5732" chip, under it the
   faktura and three žádosti fan out as miniature papers. CSS-only, 4s loop;
   app tokens only. #}
<style>
  .dz1350-demo {
    box-sizing: border-box; height: 140px; padding: 14px; margin-bottom: 16px; border-radius: 12px;
    background: var(--wn-bg); overflow: hidden; display: grid; place-items: center;
    font-size: 11px; line-height: 1.2; color: var(--wn-ink);
  }
  .dz1350-col { display: grid; gap: 10px; justify-items: center; }
  .dz1350-kod { font-weight: 800; font-size: 15px; letter-spacing: .5px; padding: 3px 12px; border-radius: 8px; background: var(--wn-card); box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
  .dz1350-row { display: flex; gap: 8px; }
  .dz1350-p {
    width: 34px; height: 46px; border-radius: 4px; background: var(--wn-card);
    box-shadow: 0 1px 4px rgba(0, 0, 0, .15); padding: 6px 5px; box-sizing: border-box;
    opacity: 0; transform: translateY(8px); animation: dz1350-in 4s ease-out infinite;
  }
  .dz1350-p:nth-child(2) { animation-delay: .15s; }
  .dz1350-p:nth-child(3) { animation-delay: .3s; }
  .dz1350-p:nth-child(4) { animation-delay: .45s; }
  .dz1350-p i { display: block; height: 4px; margin-bottom: 4px; border-radius: 2px; background: var(--wn-line); }
  .dz1350-p:first-child i { background: currentColor; }
  @keyframes dz1350-in { 0%, 10% { opacity: 0; transform: translateY(8px); } 25%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .dz1350-p { animation: none; opacity: 1; transform: none; }
  }
</style>
<div class="dz1350-demo" aria-hidden="true">
  <div class="dz1350-col">
    <div class="dz1350-kod">/5732</div>
    <div class="dz1350-row">
      <div class="dz1350-p"><i></i><i></i><i></i></div>
      <div class="dz1350-p"><i></i><i></i><i></i></div>
      <div class="dz1350-p"><i></i><i></i><i></i></div>
      <div class="dz1350-p"><i></i><i></i><i></i></div>
    </div>
  </div>
</div>

{# Demo for release 1.2.0 (Pokladní doklad automaticky): the žádost appears and
   a cash receipt (PPD) slides out from behind it and gets its green check.
   CSS-only, 6.4s loop; app tokens only. Included by _whats_new.html. #}
<style>
  .dz120-demo {
    position: relative; box-sizing: border-box; height: 132px; margin-bottom: 16px; padding: 12px;
    border-radius: 12px; background: var(--wn-bg, #f0f2f5); overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 30px;
    font-size: 10px; color: var(--wn-ink, #1a1d23);
  }
  .dz120-col { position: relative; flex: none; width: 58px; display: grid; justify-items: center; gap: 5px; }
  .dz120-cola { z-index: 2; animation: dz120-a 6.4s infinite cubic-bezier(.2, .7, .3, 1); }
  .dz120-colb { z-index: 1; animation: dz120-b 6.4s infinite cubic-bezier(.2, .7, .3, 1); }

  .dz120-sheet {
    position: relative; box-sizing: border-box; width: 58px; height: 80px; padding: 8px 7px;
    border-radius: 5px; border: 1px solid var(--wn-line, #dde1e7); background: var(--wn-card, #fff);
    box-shadow: 0 2px 6px color-mix(in srgb, var(--wn-ink, #1a1d23) 10%, transparent);
    display: grid; align-content: start; gap: 4px;
  }
  .dz120-sheet i { display: block; height: 3px; border-radius: 2px; background: var(--wn-line, #dde1e7); }
  .dz120-sheet .dz120-w6 { width: 60%; } .dz120-sheet .dz120-w7 { width: 75%; } .dz120-sheet .dz120-w9 { width: 92%; }
  .dz120-sheet .dz120-title { height: 5px; background: var(--wn-soft, #e8f0fe); margin-bottom: 2px; }
  .dz120-plate {
    justify-self: start; margin-top: 3px; padding: 1px 3px; border-radius: 3px; white-space: nowrap;
    border: 1px solid var(--wn-line, #dde1e7); font-size: 6.5px; font-weight: 700; letter-spacing: .02em;
  }

  /* Příjmový pokladní doklad: black-framed like the printed receipt. */
  .dz120-ppd { padding: 6px; border-color: var(--wn-line, #dde1e7); }
  .dz120-ppd::before {
    content: ''; position: absolute; inset: 4px; border: 1.2px solid var(--wn-ink, #1a1d23); border-radius: 2px; opacity: .75;
  }
  .dz120-ppd > :not(.dz120-badge) { position: relative; }
  .dz120-ppd .dz120-h { height: 2px; width: 70%; justify-self: center; background: var(--wn-ink, #1a1d23); opacity: .55; margin-top: 4px; }
  .dz120-num { justify-self: center; font-size: 7.5px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 3px; }
  .dz120-kc { margin-top: 5px; padding-left: 3px; font-size: 9.5px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .dz120-badge {
    position: absolute; top: -8px; right: -8px; z-index: 3; box-sizing: border-box; width: 18px; height: 18px;
    border-radius: 50%; display: grid; place-items: center; background: var(--success, #059669); color: #fff;
    border: 2px solid var(--wn-bg, #f0f2f5);
    opacity: 0; animation: dz120-badge 6.4s infinite cubic-bezier(.2, .7, .3, 1);
  }
  .dz120-cap { font-size: 10px; font-weight: 700; color: var(--wn-muted, #6b7280); }
  .dz120-capb { opacity: 0; animation: dz120-capb 6.4s infinite; }
  .dz120-plus {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -16px 0 0 -8px;
    border-radius: 50%; display: grid; place-items: center; background: var(--wn-accent, #1a56db); color: #fff;
    opacity: 0; animation: dz120-plus 6.4s infinite cubic-bezier(.2, .7, .3, 1);
  }

  @keyframes dz120-a {
    0%, 2%    { opacity: 0; transform: translateY(6px); }
    10%, 93%  { opacity: 1; transform: none; }
    99%, 100% { opacity: 0; transform: none; }
  }
  @keyframes dz120-b {
    0%, 26%   { opacity: 0; transform: translateX(-88px); }
    27%       { opacity: 1; transform: translateX(-88px); }
    44%, 93%  { opacity: 1; transform: none; }
    99%, 100% { opacity: 0; transform: none; }
  }
  @keyframes dz120-capb {
    0%, 40%   { opacity: 0; }
    48%, 93%  { opacity: 1; }
    99%, 100% { opacity: 0; }
  }
  @keyframes dz120-plus {
    0%, 46%   { opacity: 0; transform: scale(.4); }
    52%       { opacity: 1; transform: scale(1.15); }
    56%, 66%  { opacity: 1; transform: scale(1); }
    74%, 100% { opacity: 0; transform: scale(.6); }
  }
  @keyframes dz120-badge {
    0%, 52%   { opacity: 0; transform: scale(.3); }
    58%       { opacity: 1; transform: scale(1.25); }
    62%, 93%  { opacity: 1; transform: scale(1); }
    99%, 100% { opacity: 0; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    /* No motion: the end state, žádost and doklad side by side. */
    .dz120-cola, .dz120-colb, .dz120-capb, .dz120-badge, .dz120-plus { animation: none; }
    .dz120-capb, .dz120-badge { opacity: 1; }
    .dz120-plus { opacity: 0; }
  }
</style>
<div class="dz120-demo" aria-hidden="true">
  <div class="dz120-col dz120-cola">
    <div class="dz120-sheet">
      <i class="dz120-title"></i><i class="dz120-w9"></i><i class="dz120-w7"></i><i class="dz120-w9"></i><i class="dz120-w6"></i>
      <span class="dz120-plate">1AB 2345</span>
    </div>
    <span class="dz120-cap">Žádost</span>
  </div>
  <span class="dz120-plus"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
  <div class="dz120-col dz120-colb">
    <div class="dz120-sheet dz120-ppd">
      <i class="dz120-h"></i>
      <span class="dz120-num">č. 142</span>
      <i class="dz120-w9"></i><i class="dz120-w7"></i><i class="dz120-w6"></i>
      <span class="dz120-kc">500 Kč</span>
      <span class="dz120-badge"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    </div>
    <span class="dz120-cap dz120-capb">Doklad</span>
  </div>
</div>

{# Demo for release 1.4 (VIN se doplní sám): the ORV types itself, a small
   "hledám VIN…" chip spins, then the VIN field fills in and the chip turns
   green. CSS-only, 6.4s loop; app tokens only. #}
<style>
  .de14-demo, .de14-demo * { box-sizing: border-box; }
  .de14-demo {
    display: grid; gap: 10px; padding: 12px; margin-bottom: var(--sp-4, 16px);
    border-radius: 14px; background: var(--bg); font-family: var(--font);
  }
  .de14-mini {
    display: grid; gap: 6px; padding: 8px 10px 9px;
    border-radius: var(--radius-sm); background: var(--card); box-shadow: var(--shadow-sm);
  }
  .de14-lrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 17px; margin-bottom: 3px; }
  .de14-label { font-size: 12px; font-weight: 600; color: var(--ink); }

  /* Inputs, like .field input. */
  .de14-input {
    position: relative; display: flex; align-items: center; height: 27px; padding: 0 10px;
    border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg);
    overflow: hidden; white-space: nowrap;
  }
  .de14-orv { animation: de14-focus-orv 6.4s infinite; }
  .de14-vin { animation: de14-focus-vin 6.4s infinite; }
  .de14-vin::before {
    content: ""; position: absolute; inset: 0; background: var(--accent); opacity: 0;
    animation: de14-flash 6.4s infinite;
  }
  .de14-txt {
    position: relative; font-size: 13px; font-weight: 700; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; color: var(--ink);
    clip-path: inset(0 100% 0 0);
  }
  .de14-txt-orv { animation: de14-type 6.4s infinite; }
  .de14-txt-vin { animation: de14-fill 6.4s infinite; }
  .de14-dash { position: absolute; left: 10px; font-size: 13px; color: var(--muted); animation: de14-dash 6.4s infinite; }

  /* Status chip (like .orv-status): searching, then found. */
  .de14-status { display: grid; justify-items: end; }
  .de14-chip {
    grid-area: 1 / 1; display: inline-flex; align-items: center; gap: 5px;
    padding: 0 8px; height: 17px; border-radius: var(--radius-pill, 9999px);
    font-size: 10.5px; font-weight: 600; line-height: 1; white-space: nowrap; opacity: 0;
  }
  .de14-search { background: var(--bg); color: var(--muted); animation: de14-search 6.4s infinite; }
  .de14-found {
    background: var(--flash-success-bg, #d1f5d3); color: var(--flash-success-ink, #1a6b2a);
    animation: de14-found 6.4s cubic-bezier(.2, .7, .3, 1) infinite;
  }
  .de14-spin {
    width: 9px; height: 9px; flex: none; border-radius: 50%;
    border: 1.5px solid var(--line); border-top-color: var(--accent);
    animation: de14-spin .8s linear infinite;
  }

  @keyframes de14-focus-orv {
    0%, 4%   { border-color: var(--line); box-shadow: none; }
    7%, 28%  { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    33%, 94% { border-color: var(--line); box-shadow: none; }
    100%     { border-color: var(--line); box-shadow: none; }
  }
  @keyframes de14-focus-vin {
    0%, 48%  { border-color: var(--line); box-shadow: none; }
    52%, 66% { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    74%, 94% { border-color: var(--line); box-shadow: none; }
    100%     { border-color: var(--line); box-shadow: none; }
  }
  @keyframes de14-type {
    0%, 7%   { clip-path: inset(0 100% 0 0); animation-timing-function: steps(10, end); }
    26%, 94% { clip-path: inset(0 0 0 0); }
    100%     { clip-path: inset(0 100% 0 0); }
  }
  @keyframes de14-fill {
    0%, 50%  { clip-path: inset(0 100% 0 0); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
    62%, 94% { clip-path: inset(0 0 0 0); }
    100%     { clip-path: inset(0 100% 0 0); }
  }
  @keyframes de14-flash {
    0%, 50%  { opacity: 0; }
    55%      { opacity: .12; }
    74%, 100% { opacity: 0; }
  }
  @keyframes de14-dash {
    0%, 49%  { opacity: 1; }
    53%, 94% { opacity: 0; }
    100%     { opacity: 1; }
  }
  @keyframes de14-search {
    0%, 28%  { opacity: 0; }
    32%, 44% { opacity: 1; }
    48%, 100% { opacity: 0; }
  }
  @keyframes de14-found {
    0%, 47%  { opacity: 0; transform: translateY(2px); }
    52%, 94% { opacity: 1; transform: none; }
    100%     { opacity: 0; transform: none; }
  }
  @keyframes de14-spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    /* No motion: the end state, ORV typed, VIN filled, chip says found. */
    .de14-orv, .de14-vin, .de14-vin::before, .de14-txt-orv, .de14-txt-vin,
    .de14-dash, .de14-search, .de14-found, .de14-spin { animation: none; }
    .de14-txt { clip-path: none; }
    .de14-dash, .de14-search { opacity: 0; }
    .de14-found { opacity: 1; transform: none; }
  }
</style>
<div class="de14-demo" aria-hidden="true">
  <div class="de14-mini">
    <div>
      <div class="de14-lrow">
        <span class="de14-label">ORV</span>
        <span class="de14-status">
          <span class="de14-chip de14-search"><i class="de14-spin"></i>hledám VIN…</span>
          <span class="de14-chip de14-found">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>VIN nalezen
          </span>
        </span>
      </div>
      <div class="de14-input de14-orv"><span class="de14-txt de14-txt-orv">UAA 123456</span></div>
    </div>
    <div>
      <div class="de14-lrow"><span class="de14-label">VIN</span></div>
      <div class="de14-input de14-vin">
        <span class="de14-dash">—</span>
        <span class="de14-txt de14-txt-vin">TMBJJ7NE5L0123456</span>
      </div>
    </div>
  </div>
</div>
